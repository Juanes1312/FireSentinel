name: firesentinel
description: "App de monitoreo y alerta temprana de incendios conectada a sensores ESP32 vía Firebase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  firebase_auth: ^4.20.0
  firebase_core: ^2.32.0
  firebase_database: ^10.5.7
  firebase_messaging: ^14.9.4
  provider: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logotipo.png"
  min_sdk_size: 21
  adaptive_icon_background: "#0B172A"
  adaptive_icon_foreground: "assets/logotipo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
